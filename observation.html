<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腹痛｜観察チェック（試作）</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#203b40;background:#f2f7f6}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:18px 15px 36px}h1{font-size:24px;margin:8px 0}p{line-height:1.6}.small{font-size:13px;color:#50696b}.alert{background:#fff0e9;border:1px solid #e4b49d;border-radius:12px;padding:12px;font-size:13px}.section{background:white;border:1px solid #d6e4e2;border-radius:16px;margin:16px 0;padding:14px}h2{font-size:17px;color:#116b64;margin:0 0 12px}.item{padding:12px 0;border-top:1px solid #edf2f1}.item:first-of-type{border-top:0}.line{display:flex;align-items:center;gap:9px;font-weight:600}.line input{width:20px;height:20px;accent-color:#116b64;flex:none}.detail{margin:9px 0 0 29px;display:none}.detail.open{display:block}.detail label{display:block;font-size:13px;margin:8px 0 4px}.detail select,.detail textarea{width:100%;border:1px solid #b7cac7;border-radius:8px;padding:10px;background:white;font:inherit;font-size:15px}.detail textarea{min-height:55px;resize:vertical}.actions{position:sticky;bottom:0;background:#f2f7f6;padding:12px 0;display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:10px;background:#116b64;color:white;padding:13px;font-weight:bold;font-size:15px}.actions button.secondary{background:#dceae7;color:#116b64}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d6e4e2;padding:14px;border-radius:12px;font-family:inherit;font-size:13px;line-height:1.7}button{cursor:pointer}
</style></head><body><main>
<div class="small">訪問看護・観察チェックBot｜画面試作</div><h1>腹痛｜観察チェック</h1>
<p class="small">観察漏れを防ぐための一覧です。確認した項目にチェックし、必要に応じて結果を入力してください。チェックのみでは「異常なし」を意味しません。</p>
<div class="alert"><strong>緊急時は入力より対応を優先</strong><br>重篤な症状や急な状態悪化がある場合は、入力完了を待たずに緊急時指示や療養方針に沿って対応してください。診断・処置可否の判定は行いません。</div>
<p class="small">架空事例専用。患者の個人情報は入力しないでください。これはLINEに送信しない試作画面です。</p>
<div id="sections"></div><div class="actions"><button id="make">入力内容を確認</button><button class="secondary" id="reset">クリア</button></div><p id="count" class="small"></p><pre id="result" hidden></pre>
</main><script>
'use strict';
const groups=[
['① 痛みの基本情報',['発症時期・突然か徐々にか','部位・放散痛','痛みの強さ（NRS）','痛みの性質','持続・波','発症後の変化']],
['② 腹部・消化器症状',['吐き気','嘔吐（回数・量・性状）','腹部膨満','排便（最終排便・便性状）','排ガス','腸蠕動音','圧痛','筋性防御','食事・水分摂取','排尿・尿量']],
['③ バイタル・全身状態',['血圧','脈拍','体温','SpO2','呼吸数・呼吸状態','意識状態・顔色・冷汗','普段との変化','酸素使用状況']],
['④ 背景・関連情報',['関連する既往歴','手術歴','使用薬剤・頓用','最近の薬剤変更','既存指示・実施済み対応']]
];
const root=document.getElementById('sections');let index=0;
for(const [title,items] of groups){const section=document.createElement('section');section.className='section';const h=document.createElement('h2');h.textContent=title;section.append(h);
for(const item of items){const n=index++;const wrap=document.createElement('div');wrap.className='item';const row=document.createElement('label');row.className='line';const check=document.createElement('input');check.type='checkbox';check.dataset.n=n;row.append(check,document.createTextNode(item));const detail=document.createElement('div');detail.className='detail';const sl=document.createElement('label');sl.textContent='確認結果（任意）';const select=document.createElement('select');for(const v of ['未入力','異常なし（確認済み）','所見あり','未確認','未実施','該当なし']){const o=document.createElement('option');o.value=v;o.textContent=v;select.append(o)}const tl=document.createElement('label');tl.textContent='具体的な所見（任意）';const note=document.createElement('textarea');note.placeholder='例：NRS4/10、今朝7時頃から。確認した事実のみ入力';note.maxLength=400;detail.append(sl,select,tl,note);wrap.append(row,detail);section.append(wrap);check.addEventListener('change',()=>{detail.classList.toggle('open',check.checked);update()});}
root.append(section)}
function update(){const n=document.querySelectorAll('input[type=checkbox]:checked').length;document.getElementById('count').textContent=`${n} / ${index} 項目を確認済み（チェックだけでは正常判定になりません）`}
document.getElementById('make').onclick=()=>{const lines=[];for(const section of document.querySelectorAll('.section')){lines.push('【'+section.querySelector('h2').textContent+'】');for(const item of section.querySelectorAll('.item')){const checked=item.querySelector('input').checked;const label=item.querySelector('.line').textContent;const status=item.querySelector('select').value;const note=item.querySelector('textarea').value.trim();lines.push(label+'：'+(checked?(status==='未入力'?'確認済み・結果未入力':status):'未確認・未入力')+(checked&&note?'／'+note:''));}}const out=document.getElementById('result');out.textContent='【架空事例｜入力内容の確認・プレビュー】\n※LINE送信・保存はしていません。\n\n'+lines.join('\n');out.hidden=false;out.scrollIntoView({behavior:'smooth',block:'start'})};
document.getElementById('reset').onclick=()=>{if(!confirm('この画面の入力をすべてクリアしますか？'))return;document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);document.querySelectorAll('.detail').forEach(x=>x.classList.remove('open'));document.querySelectorAll('select').forEach(x=>x.selectedIndex=0);document.querySelectorAll('textarea').forEach(x=>x.value='');document.getElementById('result').hidden=true;update()};update();
</script></body></html>
